<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f3">
  <title>伙伴体重记录</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><p class="eyebrow">WELLNESS · DAILY LOG</p><h1>一起看见每一步</h1><p class="sub">伙伴体重记录 <span class="unit">kg</span></p></div>
      <span class="date-chip">每日更新</span>
    </header>
    <section class="today-section"><div class="today-title"><div><p class="eyebrow">TODAY · <span id="todayDate"></span></p><h2>今天的状态</h2></div><span class="today-badge">今日体重</span></div><div class="today-grid" id="today"></div></section>
    <section class="records"><div class="section-heading"><div><p class="eyebrow">HISTORY</p><h2>记录总览</h2></div><span id="recordCount" class="muted"></span></div><div class="table-scroll"><table><thead><tr><th>日期</th><th>伙伴</th><th>早上</th><th>晚上</th><th>差值</th></tr></thead><tbody id="rows"></tbody></table></div></section>
    <section class="detail-section"><div class="intro-row"><div><p class="eyebrow">PERSONAL VIEW</p><h2>查看个人趋势</h2></div><label class="mode-control">趋势<select id="metric"><option value="both">早晚体重</option><option value="morning">仅早上</option><option value="evening">仅晚上</option><option value="change">早晚差值</option></select></label></div><nav class="person-tabs" id="personTabs" aria-label="选择伙伴"></nav><article id="detail" class="detail-card"></article></section>
    <footer>虚线空心点为相邻记录插值估算；记录缺失时不会当作实测值展示。</footer>
  </main>
  <script src="data.js"></script><script src="app.js"></script>
</body>
</html>
