<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f3">
  <title>伙伴体重记录</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><p class="eyebrow">WELLNESS · DAILY LOG</p><h1>一起看见每一步</h1><p class="sub">伙伴体重记录 <span class="unit">kg</span></p></div>
      <span class="date-chip">每日更新</span>
    </header>
    <section class="intro-row"><div><p class="eyebrow">YOUR CREW</p><h2>各自的节奏，各自的进步</h2></div><label class="mode-control">趋势<select id="metric"><option value="both">早晚体重</option><option value="morning">仅早上</option><option value="evening">仅晚上</option><option value="change">早晚差值</option></select></label></section>
    <section class="people-grid" id="people"></section>
    <section class="records"><div class="section-heading"><div><p class="eyebrow">HISTORY</p><h2>每日记录</h2></div><span id="recordCount" class="muted"></span></div><div class="table-scroll"><table><thead><tr><th>日期</th><th>伙伴</th><th>早上</th><th>晚上</th><th>差值</th></tr></thead><tbody id="rows"></tbody></table></div></section>
    <footer>虚线空心点为相邻记录插值估算；记录缺失时不会当作实测值展示。</footer>
  </main>
  <script src="data.js"></script><script src="app.js"></script>
</body>
</html>
